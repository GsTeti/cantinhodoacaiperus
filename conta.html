<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Conta — Cantinho do Açaí Perus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800;1,6..12,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="app-header">
  <div class="wrap">
    <a href="index.html" class="app-header-brand">
      <img src="img/logo.png" alt="logo">
      <strong>Cantinho do Açaí Perus</strong>
    </a>
    <nav class="app-header-nav">
      <a href="index.html">🛒 Cardápio</a>
      <button type="button" id="logout-btn" style="display:none;">Sair</button>
    </nav>
  </div>
</header>

<main class="app-main">
  <div class="wrap">

    <!-- ---------- Tela de login / cadastro ---------- -->
    <section id="auth-view" class="app-narrow">
      <div class="app-card">
        <h1 class="app-title">Minha conta</h1>
        <p class="app-subtitle">Entre para acompanhar seus pedidos e salvar endereços.</p>

        <div class="app-tabs">
          <div class="app-tab active" id="tab-login">Entrar</div>
          <div class="app-tab" id="tab-signup">Criar conta</div>
        </div>

        <div class="app-msg" id="auth-msg"></div>

        <form id="login-form">
          <div class="app-field">
            <label for="login-email">E-mail</label>
            <input type="email" id="login-email" required placeholder="seu@email.com">
          </div>
          <div class="app-field">
            <label for="login-password">Senha</label>
            <input type="password" id="login-password" required placeholder="••••••••">
          </div>
          <button type="submit" class="app-btn">Entrar</button>
        </form>

        <form id="signup-form" style="display:none;">
          <div class="app-field">
            <label for="signup-name">Nome</label>
            <input type="text" id="signup-name" required placeholder="Seu nome">
          </div>
          <div class="app-field">
            <label for="signup-phone">Telefone / WhatsApp</label>
            <input type="tel" id="signup-phone" required placeholder="(11) 90000-0000">
          </div>
          <div class="app-field">
            <label for="signup-email">E-mail</label>
            <input type="email" id="signup-email" required placeholder="seu@email.com">
          </div>
          <div class="app-field">
            <label for="signup-password">Senha</label>
            <input type="password" id="signup-password" required minlength="6" placeholder="mínimo 6 caracteres">
          </div>
          <button type="submit" class="app-btn">Criar conta</button>
        </form>
      </div>
    </section>

    <!-- ---------- Área logada ---------- -->
    <section id="account-view" style="display:none;">
      <div class="app-narrow" style="max-width:640px;">

        <h1 class="app-title" id="welcome-title">Olá!</h1>
        <p class="app-subtitle">Gerencie seus endereços e veja seus pedidos anteriores.</p>

        <h2 class="app-section-title">📍 Endereços salvos</h2>
        <div id="addresses-list"></div>
        <button type="button" class="app-btn-outline" id="add-address-btn">➕ Adicionar endereço</button>

        <form id="address-form" style="display:none; margin-top:18px;">
          <div class="app-field">
            <label for="addr-label">Nome do endereço (ex: Casa, Trabalho)</label>
            <input type="text" id="addr-label" placeholder="Casa">
          </div>
          <div class="app-field">
            <label for="addr-address">Endereço completo</label>
            <input type="text" id="addr-address" required placeholder="Rua, número, bairro">
          </div>
          <div class="app-field">
            <label for="addr-reference">Ponto de referência (opcional)</label>
            <input type="text" id="addr-reference" placeholder="Ex: perto do mercado">
          </div>
          <button type="submit" class="app-btn">Salvar endereço</button>
        </form>

        <h2 class="app-section-title">🧾 Meus pedidos</h2>
        <div id="orders-list"></div>

      </div>
    </section>

  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="conta.js"></script>
</body>
</html>
